name: Preview Release

# Publish every PR to Cloud Storage at pr-<number>/release.tar.gz,
# so a customer can install an unmerged feature with:
#   curl -s .../install.sh | sudo bash -s preview-pr-<number>
# Every push to the PR rebuilds the preview. Closing the PR deletes it.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  # Runs the PR's code, so it gets a read-only token
  build:
    # Fork PRs get a read-only token and cannot publish, so only build PRs from
    # this repository
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed'
    runs-on: ubuntu-22.04
    # A new push makes the running build stale
    concurrency:
      group: preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # The default pull_request ref is the PR merged into its base branch, so
      # the preview also carries every fix already on main
      - name: "Checkout code"
        uses: actions/checkout@v6

      - name: "Set up Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Mark the build as a preview, so the version badge in the UI shows it
      - name: "Set preview version"
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_VERSION="$(node -p "require('./frontend/package.json').version")"
          VERSION="${BASE_VERSION}-pr${PR_NUMBER}.${HEAD_SHA::7}"
          (cd frontend && npm pkg set version="$VERSION")
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: "Build Project"
        run: |
          ./create_release.sh

      - name: "Upload release archive"
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 1

  # Never runs the PR's code, so it can hold a write token and the Google
  # Cloud credential
  publish:
    needs: build
    runs-on: ubuntu-22.04
    # Shared with cleanup and never cancelled, so a preview is not left half
    # published
    concurrency:
      group: preview-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # Point the preview tag at the built commit
      pull-requests: write # Comment the install command on the PR
      id-token: write # Authenticate to Google Cloud with Workload Identity Federation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BUILD_SHA: ${{ needs.build.outputs.sha }}
      VERSION: ${{ needs.build.outputs.version }}
      PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}

    steps:
      - name: "Download release archive"
        uses: actions/download-artifact@v4
        with:
          name: release

      # The PR may have closed while it was building
      - name: "Check the preview is still wanted"
        id: wanted
        run: |
          WANTED="$(gh pr view "$PR_NUMBER" --json state --jq '.state == "OPEN"')"
          echo "wanted=$WANTED" >> "$GITHUB_OUTPUT"
          if [ "$WANTED" != "true" ]; then
            echo "Pull request is closed; not publishing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Authenticate to Google Cloud"
        if: steps.wanted.outputs.wanted == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: "Set up gcloud"
        if: steps.wanted.outputs.wanted == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: "Publish preview"
        if: steps.wanted.outputs.wanted == 'true'
        run: |
          TAG="preview-pr-${PR_NUMBER}"
          OBJECT="pr-${PR_NUMBER}/release.tar.gz"

          # Point the tag at the commit that was built. The tag protects the
          # merge commit from garbage collection after the PR moves on.
          gh api "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 \
            && gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f sha="$BUILD_SHA" -F force=true >/dev/null \
            || gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$BUILD_SHA" >/dev/null

          # Overwriting an object is atomic, so an install that is already
          # downloading gets the old or the new archive, never a mix. Disable
          # caching so the next install gets this build.
          gcloud storage cp release.tar.gz "gs://${PREVIEW_BUCKET}/${OBJECT}" \
            --cache-control=no-store \
            --custom-metadata="version=${VERSION},commit=${BUILD_SHA}"

          # Must match the URL that install.sh builds for preview-* versions
          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "download_url=https://storage.googleapis.com/${PREVIEW_BUCKET}/${OBJECT}" >> "$GITHUB_ENV"
          echo "install_url=https://raw.githubusercontent.com/${GH_REPO}/main/install.sh" >> "$GITHUB_ENV"

      # Keep one comment per PR and edit it on every push
      - name: "Comment install command"
        if: steps.wanted.outputs.wanted == 'true'
        run: |
          MARKER="<!-- preview-release -->"
          cat > comment.md <<EOF
          ${MARKER}
          **Preview build:** [\`${tag}\`](${download_url}) (\`${VERSION}\`, built from \`${BUILD_SHA::7}\`)

          \`\`\`sh
          curl -s ${install_url} | sudo bash -s ${tag}
          \`\`\`

          Rebuilt on every push. Closing this pull request deletes the preview.
          EOF

          COMMENT_ID="$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${MARKER}\"))) | .id" | head -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -F body=@comment.md >/dev/null
          else
            gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -F body=@comment.md >/dev/null
          fi

          echo "Published \`${tag}\` (\`${VERSION}\`)" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    runs-on: ubuntu-22.04
    concurrency:
      group: preview-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # Delete the preview tag
      pull-requests: write # Update the PR comment
      id-token: write # Authenticate to Google Cloud with Workload Identity Federation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}

    steps:
      - name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: "Set up gcloud"
        uses: google-github-actions/setup-gcloud@v3

      - name: "Delete preview"
        run: |
          TAG="preview-pr-${PR_NUMBER}"
          PREFIX="gs://${PREVIEW_BUCKET}/pr-${PR_NUMBER}/"
          # Nothing is uploaded if the PR closed before its first build finished
          if gcloud storage ls "$PREFIX" >/dev/null 2>&1; then
            gcloud storage rm --recursive "$PREFIX"
          fi
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true

          MARKER="<!-- preview-release -->"
          COMMENT_ID="$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${MARKER}\"))) | .id" | head -n 1)"
          if [ -n "$COMMENT_ID" ]; then
            printf '%s\n~~Preview build `%s`~~ deleted.\n' "$MARKER" "$TAG" > comment.md
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -F body=@comment.md >/dev/null
          fi

          echo "Deleted \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
