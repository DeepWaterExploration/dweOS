name: Build Docker Image
on:
  push:
    tags:
      - "*-blueos"
  pull_request:
    paths:
      - "docker/**"
      - "backend_py/requirements.txt"
      - ".github/workflows/blueos.yml"
  workflow_dispatch:
    inputs:
      test_tag:
        description: "Push only this tag (e.g. bookworm-test) for manual install testing; leave empty to publish the ref name + latest"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build_docker_image:
    runs-on: ubuntu-22.04-arm
    env:
      # PR refs look like "123/merge", which isn't a valid image tag
      DOCKER_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      # Only publish to Docker Hub for tag pushes and manual runs; PRs just build
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}
      DOCKER_REPO: deepwaterexploration/dwe_os_2
      TEST_TAG: ${{ inputs.test_tag }}
    steps:
      - name: "Compute image tags"
        id: tags
        run: |
          if [ -n "$TEST_TAG" ]; then
            # Keep test builds out of the Bazaar (which indexes SemVer tags) and off latest
            if [ "$TEST_TAG" = "latest" ] || echo "$TEST_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::test_tag must not be 'latest' or a version number"
              exit 1
            fi
            echo "list=$DOCKER_REPO:$TEST_TAG" >> "$GITHUB_OUTPUT"
          else
            {
              echo "list<<EOF"
              echo "$DOCKER_REPO:$DOCKER_TAG"
              echo "$DOCKER_REPO:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Set up Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/arm/v7,linux/arm64

      - name: "Log in to Docker Hub"
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build Project"
        run: |
          ./create_release.sh

      - name: "Build and Push Docker Image"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64,linux/arm/v7
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
