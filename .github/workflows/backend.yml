name: Backend CI

on:
  # Commented to avoid double runs
  push:
    branches:
      - main
  #     - "feature/**"
  #     - "fix/**"
  #     - "bugfix/**"
  #     - "refactor/**"
  #   paths:
  #     - backend_py/**
  #     - ".github/workflows/backend.yml"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: "3.11"

      - name: Restore cached virtualenv
        id: cache-venv-restore
        uses: actions/cache/restore@v4
        with:
          key: venv-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('backend_py/requirements.txt') }}
          path: .venv

      - name: Install dependencies
        if: steps.cache-venv-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install build-essential libdbus-glib-1-dev libdbus-1-dev libpython3-dev -y # For dbus-python
          ./create_venv.sh
          source .venv/bin/activate
          pip install ruff bandit ty

      - name: Saved cached virtualenv
        uses: actions/cache/save@v4
        if: steps.cache-venv-restore.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.cache-venv-restore.outputs.cache-primary-key }}
          path: .venv

      - name: Activate venv
        run: |
          source .venv/bin/activate
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Ruff linting
        run: ruff check --output-format=github backend_py

      - name: Ruff formatting
        run: ruff format --check backend_py

      - name: Bandit security check (high severity)
        run: bandit -r backend_py -lll

      - name: Type checking (ty)
        run: ty check backend_py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check frontend OpenAPI schema is up to date
        run: |
          python3 -m backend_py.scripts.export_openapi
          cd frontend
          npx openapi-typescript ../openapi.json -o ./src/schemas/dwe_os_2.d.ts
          if ! git diff --exit-code -- src/schemas/dwe_os_2.d.ts; then
            echo "::error file=frontend/src/schemas/dwe_os_2.d.ts::Schema is out of date. Start the backend, run 'npm run regenerate-schemas' in frontend/, and commit the result."
            exit 1
          fi
