name: Build Docker Image
on:
  push:
    tags:
      - "*-blueos"
  pull_request:
    paths:
      - "docker/**"
      - "backend_py/requirements.txt"
      - ".github/workflows/blueos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_docker_image:
    runs-on: ubuntu-22.04-arm
    env:
      # PR refs look like "123/merge", which isn't a valid image tag
      DOCKER_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      # Only publish to Docker Hub for tag pushes and manual runs; PRs just build
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}
      DOCKER_REPO: deepwaterexploration/dwe_os_2
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Set up Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/arm/v7,linux/arm64

      - name: "Log in to Docker Hub"
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build Project"
        run: |
          ./create_release.sh

      - name: "Build and Push Docker Image"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64,linux/arm/v7
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: |
            ${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
