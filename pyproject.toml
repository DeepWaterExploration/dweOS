[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dweos"
version = "0.9.0"
description = "dweOS driver interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "linuxpy==0.13.0", "natsort==8.4.0", "PyEventEmitter==1.0.5",
  "fastapi", "pydantic", "python-socketio", "uvicorn",
  "sdbus==0.14.0", "sdbus-networkmanager==2.0.0", "pyserial", "colorlog==6.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend_py"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"
exclude = ["v4l2.py"] # exclude v4l2.py, since it's included as a lib directly

[tool.ty.environment]
python = ".venv"

[tool.pylint."messages control"]
disable = ["R0903"]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  "ANN2",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
