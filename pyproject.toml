[tool.ruff]
line-length = 88
indent-width = 4
exclude = ["v4l2.py"] # exclude v4l2.py, since it's included as a lib directly

[tool.ty.environment]
python = ".venv"

[tool.pylint."messages control"]
disable = ["R0903"]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  "ANN2",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
